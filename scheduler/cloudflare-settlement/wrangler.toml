name = "sharp-app-settlement-scheduler"
main = "src/index.js"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

[triggers]
crons = ["47 * * * *"]

[vars]
GITHUB_OWNER = "jesahsclassof2012-ops"
GITHUB_REPO = "sharp_app"
GITHUB_WORKFLOW = "settle-results.yml"
GITHUB_REF = "main"

[secrets]
required = ["GITHUB_TOKEN"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
